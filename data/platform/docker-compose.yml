services:
  postgres:
    image: postgres:16
    container_name: annapurna-postgres
    environment:
      POSTGRES_USER: annapurna
      POSTGRES_PASSWORD: annapurna
      POSTGRES_DB: annapurna
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../masters.sql:/docker-entrypoint-initdb.d/01-masters.sql:ro

volumes:
  postgres-data: