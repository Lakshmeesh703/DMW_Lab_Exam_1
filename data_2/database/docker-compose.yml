services:
  postgres:
    image: postgres:16
    container_name: setubid-postgres
    environment:
      POSTGRES_USER: setubid
      POSTGRES_PASSWORD: setubid-secret
      POSTGRES_DB: setubid
    ports:
      - "5433:5432"
    volumes:
      - setubid-postgres-data:/var/lib/postgresql/data

volumes:
  setubid-postgres-data: