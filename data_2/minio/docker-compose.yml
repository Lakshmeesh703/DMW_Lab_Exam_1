services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: setubid-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: setubid
      MINIO_ROOT_PASSWORD: setubid-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data: